    - {name: Geo support, roles: [offfield_dps, shield, buffer_general], elements: [Geo], core: true, weight: 1.5}
    - {name: Geo support, roles: [offfield_dps, shield, buffer_general, offfield_app], elements: [Geo]}
    - {name: Flex, roles: [buffer_general, buffer_atk, shield, offfield_dps], elements: [Geo, Pyro, Electro]}

overloaded:
  label: Chevreuse Overloaded
  signature: {only: [Pyro, Electro]}
  ceiling: 0.8
  allowed_elements: [Pyro, Electro]
  slots:
