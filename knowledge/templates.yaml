    - {name: Hydro applicator, roles: [offfield_app], elements: [Hydro], core: true, min_quality: 4, weight: 1.5}
    - {name: Buffer, roles: [buffer_atk, buffer_anemo, buffer_general]}
    - {name: Flex support, roles: [shield, buffer_anemo, healer, buffer_general]}

international:
  label: International (Hydro carry with Pyro)
  signature: {require: [Hydro, Pyro], forbid: [Dendro]}
  ceiling: 0.85
  slots:
    - {name: Hydro carry, roles: [carry_international], elements: [Hydro], core: true, weight: 2}
    - {name: Pyro off-field, roles: [offfield_dps], elements: [Pyro], core: true, min_quality: 4, weight: 1.5}
    - {name: ATK buffer, roles: [buffer_atk], weight: 1.5}
    - {name: Anemo buffer, roles: [buffer_anemo]}

aggravate:
