  signature: {require: [Electro, Dendro], forbid: [Hydro]}
  ceiling: 0.9
  slots:
    - {name: Electro carry, roles: [carry_aggravate], elements: [Electro], core: true, weight: 2}
    - {name: Dendro applicator, roles: [offfield_app], elements: [Dendro], core: true, min_quality: 3, weight: 1.5}
    - {name: Electro off-field, roles: [offfield_app], elements: [Electro], min_quality: 3}
    - {name: Flex support, roles: [buffer_anemo, shield, healer, buffer_general, offfield_app]}

hyperbloom:
  label: Hyperbloom
  signature: {require: [Dendro, Hydro, Electro]}
  ceiling: 0.9
  compare: archetype
  slots:
    - {name: Dendro applicator, roles: [offfield_app], elements: [Dendro], core: true, min_quality: 3, weight: 1.5}
    - {name: Hydro applicator, roles: [offfield_app], elements: [Hydro], core: true, min_quality: 3, weight: 1.5}
    - {name: Electro trigger, roles: [offfield_app], elements: [Electro], core: true, min_quality: 3, weight: 1.5}
    - {name: Flex, roles: [offfield_app, em_share, healer, shield], elements: [Dendro, Hydro, Electro, Anemo, Geo]}

nilou_bloom:
  label: Nilou Bloom
  signature: {only: [Hydro, Dendro]}
  ceiling: 0.85
