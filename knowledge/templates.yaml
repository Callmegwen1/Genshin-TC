    - {name: Electro damage, roles: [offfield_dps, offfield_app, carry_hypercarry, carry_national_driver], elements: [Electro], core: true, weight: 1.5}
    - {name: Flex, roles: [offfield_dps, offfield_app, buffer_atk, buffer_general, healer]}
