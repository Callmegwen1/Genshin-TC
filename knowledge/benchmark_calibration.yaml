  # ---------- carries ----------
  - id: viable_carries_on_a_mixed_account
    question: carries
    account: {roster: [Diluc, Bennett, Xingqiu, Kaedehara Kazuha, Zhongli, Amber, Kaeya, Lisa, Noelle, Fischl]}
    expect: {viable_includes: [Diluc], viable_excludes: [Amber, Kaeya, Lisa]}
    confidence: medium
    reason_tags: [carry-gap]
    sensitive_to: [account.viable_carry_potential]
    source: consensus

  # ---------- content modes ----------
  - id: narrow_vs_broad_modes
    question: mode
    accounts:
      narrow: [Neuvillette, Furina, Kaedehara Kazuha, Zhongli, Amber, Kaeya, Lisa, Noelle]
      broad: [Xiangling, Bennett, Xingqiu, Fischl, Beidou, Sucrose, Chongyun, Diona, Barbara, Noelle, Ningguang, Kaeya, Lisa, Razor, Kujou Sara, Yanfei, Thoma, Collei, Dori, Layla, Kuki Shinobu, Rosaria]
    expect: {stygian: [narrow, broad], theater: [broad, narrow]}
    confidence: medium
    source: consensus

  # ---------- model 6.3: focused reliability batch (Claude's reading of consensus, to be reviewed) ----------
  - id: close_national_xingqiu_vs_yelan
    question: team_ranking
    lineups:
      xingqiu: [Raiden Shogun, Xiangling, Xingqiu, Bennett]
      yelan: [Raiden Shogun, Xiangling, Yelan, Bennett]
    pairs: [{better: yelan, worse: xingqiu, gap: small}]
    confidence: medium
    reason_tags: [close-call, roughly-equal]
    source: consensus
  - id: support_allocation_two_hydro_carries
    question: plan
    account: {roster: [Hu Tao, Neuvillette, Furina, Xingqiu, Yelan, Zhongli, Kaedehara Kazuha, Layla]}
    expect: {members_in_plan: [Hu Tao, Neuvillette], team_with: Neuvillette, includes: [Furina]}
    confidence: medium
    reason_tags: [support-allocation, two-teams, overlap]
    source: consensus
  - id: completing_support_beats_redundant_carry
    question: pull_ranking
    account: {roster: [Neuvillette, Furina, Kaedehara Kazuha, Zhongli, Hu Tao, Xingqiu, Bennett, Xiangling, Sucrose, Fischl]}
    candidates: [Yelan, Mualani]
    # Reviewed in model 6.4: ambiguous. The direction (Yelan completes Hu Tao's double Hydro; Mualani is a third
    # carry) is a consensus lean, but the size depends on this roster: Hu Tao already has Xingqiu, so Yelan's
    # increment is modest, and Mualani can form a third team. Encoded as a small-gap lean at low confidence.
    pairs: [{better: Yelan, worse: Mualani, gap: small}]
    confidence: low
    reason_tags: [strong-generic-low-account-value, moderate-generic-high-account-value, ambiguous]
    source: consensus
  - id: four_carries_is_a_legal_team
    question: validity
    lineup: [Hu Tao, Kamisato Ayaka, Raiden Shogun, Neuvillette]
    classification: valid_weak
    expect: {legal: true, support: unusual}
    confidence: high
    reason_tags: [manual-team-builder, weird-but-valid]
    source: consensus
  - id: off_meta_template_free_team_is_legal
    question: validity
    lineup: [Noelle, Xiangling, Fischl, Barbara]
    classification: valid_weak
    expect: {legal: true}
    confidence: high
    reason_tags: [manual-team-builder, weird-but-valid]
    source: consensus
  - id: two_travelers_is_illegal
    question: validity
    lineup: [Traveler (Anemo), Traveler (Cryo), Bennett, Xiangling]
    classification: invalid
    expect: {legal: false}
    confidence: high
    reason_tags: [manual-team-builder]
    source: consensus
  - id: support_only_lineup_is_flagged
    question: validity
    lineup: [Citlali, Xilonen, Furina, Bennett]
    classification: valid_weak
    expect: {legal: true, support: unusual, weaker_than: [Mavuika, Citlali, Xilonen, Bennett]}
    confidence: high
    reason_tags: [false-positive-leftover, support-only]
    source: consensus
  - id: provisional_team_is_kit_model
    question: validity
    lineup: [Sandrone, Yae Miko, Odette, Alyosha]
    classification: valid
    expect: {legal: true, support: unusual}
    confidence: high
    reason_tags: [provisional-kit, low-data]
    source: consensus

