# Forward-model annotations (FM-3): what the forward model needs that a kit's effect text does not state as numbers.
# Read by gtc/forward/effects.py. Each entry patches the kit effect whose `source` starts with `match` (and has `kind`
# when given). Facts stay in the kits (knowledge/kits, knowledge/kits_compiled); this file adds how to resolve them:
#
#   trigger    actions that start the effect: skill | skill_hold | burst | normal | charged | plunge | dash | swirl |
#              always | "hit:<ability>" (a hit of the caster with that ability name prefix, e.g. Mona's bubble popping).
#              A trace action "skill" counts as a press.
#   _snapshot  per character: damage types whose hits use the buffs active when the owner cast the action that
#              produced them (snapshotting), not those active at the hit. Sourced from gcsim's implementation.
#   delay      seconds from the trigger to the start (Mona's Omen starts when the bubble pops)
#   duration   seconds, or {table: [skill|burst|normal, label], index}
#   amount     number; {table: [kind, label], index, of: atk|hp|def|em|er|base_atk} (table value x the caster's stat);
#              {of: stat, rate, per, cap, above} (rate x (stat - above) / per, capped)
#   by_count   {elements, values}: amount by the number of party members of these elements (Escoffier: 5/10/15/55%)
#   quota      hits that consume the effect, per receiver: number or {table: [...], index} (Shenhe's Icy Quill)
#   element_from: swirl   the effect is for the swirled element (Kazuha A4, Sucrose A1)
#   conditions replaces the effect's conditions (faction_count: {faction, min})
#   special    fanfare (Furina): the amount comes from the party-HP model in gtc/forward/effects.py
#
# Talent tables are read at the build's talent level. reviewed: claude (human review pending).
_factions:
  # Moonsign (Nod-Krai): kits with a "Moonsign Benediction" passive. Hexerei: kits with a "Witch's Eve Rite" passive.
  # Derived automatically from Amber talent names in gtc/forward/effects.py; listed here only as overrides.
  {}

_snapshot:   # gcsim otherwise keeps buffs on a character as statuses (see model.py "active" targets)
  Kaedehara Kazuha: [burst]   # Kazuha Slash's DoT and absorbed damage snapshot at cast (game and gcsim)

Kamisato Ayaka:
  - {match: "Amatsumi Kunitsumi Sanctification", trigger: [skill]}
  - {match: "Kanten Senmyou Blessing", trigger: [dash]}

Shenhe:
  - {match: "Spring Spirit Summoning (Icy Quill)", trigger: [skill], duration: {table: [skill, "Press/Hold Duration"], index: 0},
     amount: {table: [skill, "DMG Bonus"], of: atk}, quota: {table: [skill, "Press/Hold Trigger Quota"], index: 0}}
  - {match: "Divine Maiden's Deliverance", trigger: [burst], duration: {table: [burst, "Duration"]},
     amount: {table: [burst, "RES Decrease"]}}
  - {match: "Deific Embrace", trigger: [burst], duration: {table: [burst, "Duration"]}}
  - {match: "Spirit Communion Seal (press)", trigger: [skill]}
  - {match: "Spirit Communion Seal (hold)", trigger: [skill_hold]}

Kaedehara Kazuha:
  - {match: "Poetics of Fuubutsu", trigger: [swirl], element_from: swirl, amount: {of: em, rate: 0.0004}}

Mona:
  # Omen: applied from the bubble's first hit for the bubble's life (Illusory Bubble Duration); in Freeze the frozen
  # enemy keeps the bubble, so this is the window gcsim shows (approximation; Omen's own 4-5 s after a pop is shorter).
  # Omen is an additive DMG% (as gcsim).
  - {match: "Stellaris Phantasm (Omen)", trigger: ["hit:Illusory Bubble (Initial)"], duration: {table: [burst, "Illusory Bubble Duration"]},
     amount: {table: [burst, "DMG Bonus"], index: 0}}
  - {match: "Waterborne Destiny", trigger: [always], amount: {of: er, rate: 0.2}}

Furina:
