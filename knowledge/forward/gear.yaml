# Curated gear effects (phase H): entries the text compiler cannot read alone, because the value depends on the party,
# a resource, stack levels, swaps or a house assumption. Numbers are the Amber text's (lists are by refinement R1..R5;
# tests/test_gear.py checks each number appears in that refinement's text). Everything else is compiled from the text.
#
# Schema: as gtc/forward/gear.py. Extra amount specs: {of, rate, minus, cap} (wearer stat), {per_same_element},
# {per_other_element}, {party_energy_rate, cap}. Stack specs: stack_max/stack_mode, stack_sources (each active source
# is one level), stack_steps (value per level), stack_threshold (all-or-nothing at N stacks).

weapons:
  Mailed Flower:
    - {kind: atk_pct, amount: [0.12, 0.15, 0.18, 0.21, 0.24], trigger: [skill, "reaction_own:any"], duration: 8, state: met}
