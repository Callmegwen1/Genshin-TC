Odette:
  schema: 2
  provisional: true
  role: sub_dps
  element: Cryo
  weapon: sword
  analogue: Rosaria          # simulated off-field Cryo sub-DPS in Superconduct teams; Odette's Stellar conversion has no simulated equivalent
  field: {behaviour: off_field, share: [0.1, 0.25]}
  personal_damage: {tier: medium, share: [0.15, 0.35]}     # Prydwen ranks her Sub-DPS; Solo Dance Double attacks off-field
  application: {Cryo.off: [2.0, 4.0], Cryo.on: [0.5, 1.5]}
  buffs:
