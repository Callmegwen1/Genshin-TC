    prydwen: "Prydwen guide: Sub-DPS tier T0; teams with Sandrone / Yae Miko / Alyosha, Cyno / Yae Miko, Vesna / Faruzan, Yumemizuki Mizuki / Faruzan"
    judgment: "Hand estimate from the kit text and Prydwen's teams; no measurement"
