  reactions: {owns: [], enables: [superconduct, swirl-cryo], converts: {superconduct: Stellar-Conduct, swirl-cryo: Stellar Swirl}}
  preferred_systems: [superconduct, swirl-cryo]
  restrictions:
    - {rule: needs_element, any_of: [Electro, Anemo], why: "Stellar-Conduct needs Electro and Stellar Swirl needs Anemo; every team Prydwen lists has one"}
  synergies:
    - {with: Sandrone, why: "Prydwen: Sandrone's best teammate"}
    - {with: Yae Miko, why: "off-field Electro for Stellar-Conduct"}
    - {with: Faruzan, why: "Anemo for Stellar Swirl in Vesna and Mizuki teams"}
  roles: {offfield_app: 5, offfield_dps: 4, support_superconduct_cryo_carry: 4, support_superconduct_electro_carry: 4, support_anemo_carry: 4, support_mono_cryo: 3}
  sources:
