    analogue: {source: judgment, confidence: low, method: manual}
    field: {source: judgment, confidence: low, method: manual}
    personal_damage: {source: prydwen, confidence: low, method: manual}
    application: {source: judgment, confidence: low, method: manual}
    synergies: {source: prydwen, confidence: medium, method: manual}
