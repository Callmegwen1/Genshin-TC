# Benchmark: accounts, a question, and the answer an expert theorycrafter would give.
# `python -m gtc benchmark` scores the engine on these; `--tune` fits chosen parameters against them with
# leave-one-out cross-validation; `--record` writes the result for the current model version.
#
# Add your own cases. Each needs an id, a `kind`, the inputs for that kind, and `source` (who says so).
# Rosters list characters at full build: 5-stars C0, 4-stars C6 unless `cons` says otherwise.
#
# Kinds:
#   best_team      roster, lead or template; expect includes/excludes for the best team the engine forms
#   no_team        roster, template; expect that no valid team forms (with `lead` or `members` if given)
#   plan_team      roster, lead or member; expect the plan's team led by `lead` (or containing `member`) includes/excludes
#   pull_top       roster, pool; expect the top-valued character in `top_in`, or an answer in `top_in` within noise
#                  of the top pick (the top is not likely better, under 80%), the same rule the reports use
#   pull_kind      roster, pool, character; expect its kind in `kind_in` (and optional `not_top: 2`)
#   better_lineup  better, worse: full lineups; expect the first to have the higher potential
#   carry_gap      roster; expect no viable carry and a recommended carry built on three owned supports
#
# Sources: "scenario" cases came from the user's own corrections in earlier sessions. "consensus" cases are
# Claude's reading of community theorycrafting (Keqing Mains, Prydwen, gcsim) and should be reviewed.

cases:
  # ---------- best team for a carry ----------
