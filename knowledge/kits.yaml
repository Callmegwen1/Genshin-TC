# Character kits as numbers, for the theorycraft calculator (gtc/tc). YOU own this file.
# Numbers come from gcsim's implementation unless the note says otherwise.
#
# effects: what a character does for the team (and themselves). Each effect has:
#   kind:       stat         adds to a stat: em, atk, atk_pct, cr, cd, dmg_pct, hp, hp_pct
#               react_bonus  adds to the reaction bonus term of the damage kinds listed in applies_to
#               base_bonus   adds to the "base damage" multiplier of the kinds in applies_to (separate from DMG%)
#               res_shred    lowers enemy RES of `element` (or every element when element: all)
#               extra_hit    multiplies the Lunar-Charged reaction pool by (1 + value x uptime)
#   target:     party, active (the on-field damage dealer), self, others (everyone but the caster)
#   element:    for res_shred; 'swirled' means every Pyro, Hydro, Electro or Cryo element on the team
#   constellation: the effect needs at least this constellation
#   value:      a number, or {of: atk|hp|em|def, rate: r, per: n, cap: c} meaning min(stat / per * rate, cap)
#               using the CASTER's stats
#   uptime:     share of the rotation it is active (default 1)
#   when:       conditions. moonsign_at_least: 2 means Ascendant Gleam. hexerei_at_least: 2.
#   applies_to: damage kinds: direct, lunar_charged_direct, lunar_charged_reaction, swirl. Default: all of them.
# abilities: how gcsim names this character's damage sources, mapped to a damage kind (default direct).
# applies: elemental application strength off-field, 0 to 1. Used to keep reactions possible after a swap.
# hits: own damage per rotation, for characters gcsim has never simulated (see kits_custom/).

_rules:
  # Prydwen describes this Ascendant Gleam party buff, but gcsim does not implement it, so it is off when
  # the engine is checked against gcsim. The highest single contributor counts.
  ascendant_gleam_non_moonsign:
    in_gcsim: false
    cap: 0.36
    per_element:
      Pyro: {of: atk, rate: 0.009, per: 100}
      Electro: {of: atk, rate: 0.009, per: 100}
      Cryo: {of: atk, rate: 0.009, per: 100}
      Hydro: {of: hp, rate: 0.006, per: 1000}
      Geo: {of: def, rate: 0.01, per: 100}
      Anemo: {of: em, rate: 0.0225, per: 100}
      Dendro: {of: em, rate: 0.0225, per: 100}

Flins:
  element: Electro
  moonsign: 1
  enables: [lunar_charged]
  applies: {Electro: 1.0}
  abilities:
    Thunderous Symphony: lunar_charged_direct
    lunarcharged: lunar_charged_reaction
  effects:
    - {kind: base_bonus, target: party, value: {of: atk, rate: 0.007, per: 100, cap: 0.14}, applies_to: [lunar_charged_direct, lunar_charged_reaction], note: Moonsign passive}
    - {kind: react_bonus, target: self, value: 0.20, when: {moonsign_at_least: 2}, applies_to: [lunar_charged_direct, lunar_charged_reaction], note: A1}
    - {kind: stat, stat: em, target: self, value: {of: atk, rate: 0.08, cap: 160}, note: "A4, 8% of ATK up to 160 (Prydwen)"}

