# Character knowledge base. YOU own this file: edit freely, it is the core of the engine.
#
# roles: capability -> quality on a 1-5 scale (5 = best in role, 1 = barely works).
#   Element comes from your roster, so "offfield_app" on Xingqiu already means Hydro.
# key_talents: which talents drive the character's value (normal / skill / burst).
#   Used to rate investment. Defaults to [skill, burst].
# constellation_roles: roles that change at a constellation, e.g. {6: {buffer_lunar: 3}}.
#   Your owned constellation is used for your roster. Ideal teams assume C0.
# notes: caveats shown next to a team but never added to the score.
#   Each note can be limited to some archetypes with templates: [freeze].
# review: true marks entries I was unsure about. Check and remove the flag.
#
# Role vocabulary
#   carry_<archetype>     on-field damage dealer for that archetype
#                         (freeze, melt, vape, lunar_charged, aggravate, hypercarry, international, geo, national_driver)
#   offfield_app          applies their element while off-field
#   offfield_dps          meaningful off-field damage
#   buffer_atk            flat ATK buff (Bennett)
#   buffer_anemo          Viridescent shred and/or elemental DMG buff
#   em_share              shares Elemental Mastery
#   buffer_cryo           Cryo-specific buffs (Shenhe)
#   buffer_general        other team buffs (crit share, NA speed, ATK%)
#   buffer_overloaded     Overloaded-team buffer (Chevreuse)
#   healer, shield, battery, cc (grouping), def_shred
#   buffer_lunar          buffs Lunar reaction damage
#   moonsign              Nod-Krai Moonsign character (counts toward Ascendant Gleam)
#   enables_lunar_charged converts Electro-Charged into Lunar-Charged
#   enables_bloom         Nilou-style bloom conversion

