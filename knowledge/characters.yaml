# ---------- 4 stars ----------
Sucrose:
  roles: {buffer_anemo: 4, em_share: 5, cc: 4}
  key_talents: [skill, burst]
  notes:
    - Her main buff is Elemental Mastery, which only helps reactions. C6 adds 20% DMG of the swirled element, less than Kazuha's bonus, so in Freeze or other direct-damage teams Kazuha is the stronger Anemo pick.
Bennett:
  roles: {buffer_atk: 5, healer: 4, offfield_app: 1}
  key_talents: [burst]
  notes:
